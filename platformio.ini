; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


;
;; To only build one environment, put the environment name below.
[platformio]
default_envs = proto_all
;
;; Comment this code out when building all environments


[env:adafruit_feather_esp32s3_nopsram]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino

[env:proto_all]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
lib_ldf_mode = deep+
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<../prototypes/pms5003_proto/>
lib_deps = 
    adafruit/Adafruit PM25 AQI Sensor
    adafruit/Adafruit MLX90614 Library
    adafruit/Adafruit BME680 Library

; Full station firmware (all sensors + SD + RTC + BLE)
[env:station]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
lib_ldf_mode = deep+
build_src_filter = -<*> +<../src>
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/RTClib
    adafruit/Adafruit BME680 Library
    adafruit/Adafruit MLX90614 Library
    adafruit/Adafruit PM25 AQI Sensor
    adafruit/Adafruit MAX1704X