; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


;
;; To only build one environment, put the environment name below.
[platformio]
default_envs = proto_all
;

; This environment has all of the defaults and should build for all other environments
[env]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
 
;; We should have a separate environment for each folder
[env:proto_BME680]
build_src_filter = -<*> +<../prototypes/BME680_proto/>
lib_deps =  adafruit/Adafruit BME680 Library

[env:proto_MLX90614]
biuld_src_filter = -<*> +<../prototypes/MLX90614_proto/>
lib_deps = adafruit/Adafruit MLX90614 Library

[env:proto_PM25]
build_src_filter = -<*> +<../prototypes/PM25_proto/>
lib_deps = adafruit/Adafruit PM25 AQI Sensor


;; This should be able to support all of the testing codes
[env:proto_all]
build_src_filter = -<*> +<../prototypes/proto_all/>
lib_deps = 
    adafruit/Adafruit PM25 AQI Sensor
    adafruit/Adafruit MLX90614 Library
    adafruit/Adafruit BME680 Library

; Full station firmware (all sensors + SD + RTC + BLE)
[env:station]
build_src_filter = -<*> +<../src>
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/RTClib
    adafruit/Adafruit BME680 Library
    adafruit/Adafruit MLX90614 Library
    adafruit/Adafruit PM25 AQI Sensor
    adafruit/Adafruit MAX1704X