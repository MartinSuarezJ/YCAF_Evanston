; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


;
;; To only build one environment, put the environment name below.
[platformio]
default_envs = proto_all
;
;; Comment this code out when building all environments


[env:adafruit_feather_esp32s3_nopsram]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino


; Building an environment for the PMS5003 (air quality)
[env:pms5003_proto]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
lib_ldf_mode = deep+
build_src_filter = -<*> +<../prototypes/pms5003_proto/>
lib_deps = adafruit/Adafruit PM25 AQI Sensor

; Building an environment for the GY-906 (surface temperature)
[env:GY-906_proto]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
lib_ldf_mode = deep+
build_src_filter = -<*> +<../prototypes/GY-906_proto/>
lib_deps = adafruit/Adafruit MLX90614 Library

; Building an envrinment for the BME680 (humidity, temperature, pressure, and gas sensor)
[env:BME680_proto]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
lib_ldf_mode = deep+
build_src_filter = -<*> +<../prototypes/BME680_proto/>
lib_deps = adafruit/Adafruit BME680 Library

[env:proto_all]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
lib_ldf_mode = deep+
build_src_filter = -<*> +<../prototypes/proto_all/>
lib_deps = 
    adafruit/Adafruit PM25 AQI Sensor
    adafruit/Adafruit MLX90614 Library
    adafruit/Adafruit BME680 Library